<main>
    <form action="routeur.php" method="get">
        <input type="hidden" name="controleur" value="controleurUtilisateur">
        <input type="hidden" name="action" value="creerUtilisateur">
        <div>
            <label for="login">Login</label>
            <input type="text" name="login" placeholder="ex: jdoe" required>
        </div>
        <div>
            <label for="mdp">Mot de passe</label>
            <input type="password" name="mdp" placeholder="votre mdp" required>
        </div>
        <div>
            <label for="nom">Nom</label>
            <input type="text" name="nom" placeholder="Nom" required>
        </div>
        <div>
            <label for="prenom">Prénom</label>
            <input type="text" name="prenom" placeholder="Prénom" required>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" placeholder="email@exemple.com" required>
        </div>
        <button type="submit">créer l'utilisateur</button>
    </form>
</main>
